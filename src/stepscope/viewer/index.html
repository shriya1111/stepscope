<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stepscope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: light;
  --page: #f4f3f0; --surface: #fcfcfb; --raised: #ffffff; --line: #e3e1db; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85837d;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --wash: rgba(42,120,214,.10); --hover: rgba(11,11,11,.045);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --raised: #222221; --line: #33332f; --grid: #2a2a27;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --wash: rgba(57,135,229,.16); --hover: rgba(240,239,236,.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1a1a19; --raised: #222221; --line: #33332f; --grid: #2a2a27;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --wash: rgba(57,135,229,.16); --hover: rgba(240,239,236,.06);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .brand { font-weight: 650; letter-spacing: -.01em; font-size: 16px; }
header .brand span { color: var(--text-3); font-weight: 400; margin-left: 8px; font-size: 13px; }
select, button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
main { max-width: 1180px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { min-width: 0; }
dd { min-width: 0; overflow-wrap: anywhere; }
h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--text-2); }
.sub { color: var(--text-2); margin: 0 0 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile .k { color: var(--text-2); font-size: 12px; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .n { color: var(--text-3); font-size: 12px; }
.note { color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 10px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr:focus { background: var(--hover); outline: none; }
.num { text-align: right; }
.status { display: inline-flex; align-items: center; gap: 6px; }
.status i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; }
.status.good i { background: var(--good); } .status.critical i { background: var(--critical); }
.status.warning i { background: var(--warning); color: #0b0b0b; } .status.neutral i { background: var(--text-3); }
.meter { display: inline-block; width: 54px; height: 6px; background: var(--grid); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.tablewrap { overflow-x: auto; padding: 4px 6px; }
.back { color: var(--text-2); text-decoration: none; display: inline-block; margin-bottom: 10px; }
.back:hover { color: var(--text); }
.ep-top { display: grid; grid-template-columns: 320px 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 800px) { .ep-top { grid-template-columns: 1fr; } }
canvas#cam { width: 288px; max-width: 100%; aspect-ratio: 1; height: auto; image-rendering: pixelated; border-radius: 6px; display: block; background: var(--grid); }
.controls { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.stepno { margin-left: auto; color: var(--text-2); font-variant-numeric: tabular-nums; }
dl { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 5px 12px; margin: 0; }
dt { color: var(--text-2); } dd { margin: 0; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; background: var(--raised); }
.chip.lead { border-color: var(--text); font-weight: 600; }
.chart { position: relative; margin-bottom: 2px; }
.chart .ct { font-size: 12px; color: var(--text-2); margin: 10px 0 0 44px; }
.chart .ct b { color: var(--text); font-weight: 600; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
svg text.lbl { fill: var(--text-2); }
svg text.inseg { fill: #fff; font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0 0 44px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
#tip { position: fixed; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); display: none; z-index: 10; max-width: 280px; }
#tip .tv { font-weight: 650; font-size: 13px; color: var(--text); }
#tip .tl { color: var(--text-2); }
.tabs { display: inline-flex; margin-bottom: 12px; flex-wrap: wrap; }
.dd { display: grid; grid-template-columns: 288px 1fr; gap: 16px; }
@media (max-width: 800px) { .dd { grid-template-columns: 1fr; } }
.stage { position: relative; width: 288px; max-width: 100%; aspect-ratio: 1; }
.stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; }
.stage img { image-rendering: pixelated; }
.lvl { display: inline-flex; align-items: center; gap: 5px; }
.lvl i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.lvl.low i { background: var(--good); } .lvl.medium i { background: var(--warning); } .lvl.high i { background: var(--critical); }
.barrow { display: grid; grid-template-columns: minmax(120px, 260px) 1fr 56px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
.barrow .track { height: 10px; background: var(--grid); border-radius: 0 4px 4px 0; }
.barrow .track b { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
table.mini td, table.mini th { padding: 4px 8px; }
table.mini tbody tr { cursor: default; }
input[type=range] { width: 220px; max-width: 100%; vertical-align: middle; }
.empty { color: var(--text-2); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">stepscope<span>decision traces for robot policies</span></div>
  <label for="runsel" style="color:var(--text-2)">Run</label>
  <select id="runsel"></select>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="tip"></div>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function svg(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
/*STEPSCOPE_DATA*/
const STATIC = window.STEPSCOPE_DATA || null;  // set by "stepscope export": the page then needs no server
const api = (p) => STATIC ? (p in STATIC.api ? Promise.resolve(STATIC.api[p]) : Promise.reject(new Error("not in export")))
  : fetch("/api/" + p).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
let ROUTE = "";
const nav = (h) => { if (STATIC) { ROUTE = h; route(); scrollTo(0, 0); } else location.hash = h; };
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const pct = (x) => (x === null || isNaN(x)) ? "n/a" : Math.round(100 * x) + "%";
const fmt = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toFixed(d);
const tip = $("tip");
function showTip(evt, rows) {
  tip.replaceChildren(...rows.map(([v, l]) => el("div", {}, el("span", { class: "tv" }, v), " ", el("span", { class: "tl" }, l))));
  tip.style.display = "block";
  const w = tip.offsetWidth, x = evt.clientX + 14;
  tip.style.left = (x + w > innerWidth - 8 ? evt.clientX - w - 14 : x) + "px";
  tip.style.top = (evt.clientY + 14) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function outcome(e) {
  if (e.reason === "halted_by_gate") return ["warning", "!", "Halted by gate"];
  if (e.success === true) return ["good", "✓", "Succeeded"];
  if (e.success === false) return ["critical", "✕", "Failed" + (e.reason ? " · " + e.reason.replaceAll("_", " ") : "")];
  return ["neutral", "?", e.reason || "Unknown"];
}
const statusEl = (e) => { const [c, i, t] = outcome(e); return el("span", { class: "status " + c }, el("i", {}, i), t); };
const topCause = (e) => (e.causes && e.causes.length ? e.causes[0].label : null);

/* ---------------- routing ---------------- */
let RUNS = [], playTimer = null;
async function boot() {
  try { RUNS = await api("runs"); } catch { RUNS = []; }
  const sel = $("runsel");
  sel.replaceChildren(...RUNS.map((r) => el("option", { value: r.name }, r.name + " (" + r.episodes + ")")));
  sel.onchange = () => nav("#/run/" + sel.value);
  window.onhashchange = route;
  route();
}
function route() {
  clearInterval(playTimer); hideTip(); document.onkeydown = null; window.onresize = null;
  const app = $("app");
  if (!RUNS.length) { app.replaceChildren(el("div", { class: "empty" }, "No runs found. Create some with: stepscope demo")); return; }
  const m = (STATIC ? ROUTE : location.hash).match(/^#\/run\/([^/]+)(?:\/ep\/([^/]+)(?:\/t\/(\d+))?)?/);
  const pick = RUNS.find((r) => r.name === "eval") || RUNS[0];
  const run = m && RUNS.some((r) => r.name === m[1]) ? m[1] : pick.name;
  $("runsel").value = run;
  if (m && m[2]) episodeView(run, m[2], m[3] === undefined ? null : +m[3]); else fleetView(run);
}

/* ---------------- fleet view ---------------- */
let FILTER = "all";
async function fleetView(run) {
  const app = $("app");
  const data = await api("runs/" + encodeURIComponent(run));
  const eps = data.episodes, alertCfg = data.run.alert;
  const failed = eps.filter((e) => e.success === false && e.reason !== "halted_by_gate");
  const ok = eps.filter((e) => e.success === true);
  const halted = eps.filter((e) => e.reason === "halted_by_gate");
  const flagged = failed.filter((e) => e.first_alert_step !== null);
  const leads = flagged.map((e) => e.n_steps - 1 - e.first_alert_step);
  const falseAlarms = ok.filter((e) => e.first_alert_step !== null);

  const tile = (k, v, n) => el("div", { class: "card tile" }, el("div", { class: "k" }, k), el("div", { class: "v" }, v), el("div", { class: "n" }, n || " "));
  const tiles = el("div", { class: "tiles" },
    tile("Episodes", eps.length),
    tile("Succeeded", pct(ok.length / Math.max(eps.length, 1)), ok.length + " of " + eps.length));
  if (alertCfg) {
    if (halted.length) tiles.append(tile("Halted by gate", halted.length, "stopped on sustained high risk"));
    else {
      tiles.append(tile("Failures flagged early", failed.length ? pct(flagged.length / failed.length) : "n/a", flagged.length + " of " + failed.length + " failures"));
      tiles.append(tile("Median warning", leads.length ? Math.round(median(leads)) + " steps" : "n/a", "before the episode ended"));
      tiles.append(tile("False alarms", ok.length ? pct(falseAlarms.length / ok.length) : "n/a", falseAlarms.length + " of " + ok.length + " successes"));
    }
  }

  const parts = [el("h1", {}, run), el("p", { class: "sub" }, data.run.label || "Traced run"), tiles];
  if (!alertCfg) parts.push(el("div", { class: "note" }, "No failure predictor was attached to this run, so there are no risk scores or alerts. Train one with “stepscope train” and collect a new run with it."));
  const g = data.gated_report;
  if (g) parts.push(el("div", { class: "note" },
    `Compared with the same episodes run without halting: ${g.failures_halted_early} of ${g.failures_without_halt} failures were stopped early, saving a median of ${Math.round(g.median_steps_saved_per_halted_failure)} steps each. ` +
    `${g.successes_wrongly_halted} of ${g.successes_without_halt} episodes that would have succeeded were halted by mistake.`));
  if (data.scene) {
    const scored = eps.filter((e) => e.safety);
    const contact = scored.filter((e) => e.safety.contact_steps > 0).length, high = scored.filter((e) => e.safety.peak_level === "high").length;
    parts.push(el("div", { class: "note" }, `Scene safety: ${data.scene.hazards.map((h) => h.name).join(" and ")} are declared as hazards around the workspace. ` +
      `In ${high} of ${scored.length} episodes an action reached high safety risk; in ${contact} the robot actually entered a hazard zone.`));
  }
  const rep = data.report;
  if (rep && rep.time_only_baseline) {
    const b = rep.time_only_baseline;
    parts.push(el("div", { class: "note" },
      `Baseline for comparison: an alert based on elapsed time alone flags ${b.failures_flagged} of ${b.failures} failures, but only ${fmt(b.median_lead_steps, 0)} steps before the end.` +
      (rep.diagnosis ? ` The top symptom matches the simulator's ground-truth cause in ${pct(rep.diagnosis.agreement)} of ${rep.diagnosis.episodes} flagged failures.` : "")));
  }

  // symptoms chart: flagged failures (or halted episodes) by top symptom
  const pool = halted.length ? halted : flagged;
  const counts = {};
  for (const e of pool) { const c = topCause(e) || "no clear symptom"; counts[c] = (counts[c] || 0) + 1; }
  const bars = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (bars.length) {
    const card = el("div", { class: "card" }, el("h2", {}, (halted.length ? "Halted episodes" : "Flagged failures") + " by leading symptom at alert time"));
    card.append(barChart(bars, pool.length));
    parts.push(card);
  }

  if (data.map && data.map.length) {
    const card = el("div", { class: "card", style: "margin-top:14px" },
      el("h2", {}, "Situation map · every decision the model made, placed by its internal representation"),
      el("p", { class: "sub", style: "margin:0 0 8px;font-size:12px" }, "Nearby points are moments the model sees as similar. Click a point to open that step."));
    card.append(situationMap(data.map, run));
    parts.push(card);
  }

  const hasDeep = eps.some((e) => e.deepdives && e.deepdives.length);
  const filters = [...(hasDeep ? [["deep", "Has deep dives"]] : []), ["all", "All"], ["failed", "Failed"], ["flagged", "Alerted"], ["halted", "Halted"], ["gate", "Gate intervened"]];
  const seg = el("div", { class: "seg" });
  const tbody = el("tbody");
  const count = el("span", { style: "color:var(--text-2)" });
  function fill() {
    if (FILTER === "deep" && !hasDeep) FILTER = "all";
    const pass = { deep: (e) => e.deepdives && e.deepdives.length, all: () => true, failed: (e) => e.success === false && e.reason !== "halted_by_gate", flagged: (e) => e.first_alert_step !== null,
      halted: (e) => e.reason === "halted_by_gate", gate: (e) => e.gate.clamp + e.gate.block > 0 }[FILTER];
    const rows = eps.filter(pass);
    count.textContent = rows.length + " episodes";
    tbody.replaceChildren(...rows.map((e) => {
      const go = () => nav("#/run/" + run + "/ep/" + e.episode_id);
      const risk = e.max_risk === null ? el("td", { class: "num" }, "–") :
        el("td", { class: "num" }, el("span", { class: "meter" }, el("b", { style: "width:" + Math.round(100 * e.max_risk) + "%" })), fmt(e.max_risk));
      return el("tr", { tabindex: 0, onclick: go, onkeydown: (ev) => { if (ev.key === "Enter") go(); } },
        el("td", {}, e.episode_id), el("td", {}, statusEl(e)), el("td", { class: "num" }, e.n_steps), risk,
        el("td", { class: "num" }, e.first_alert_step === null ? "–" : "step " + e.first_alert_step),
        el("td", {}, topCause(e) || "–"), el("td", { class: "num" }, e.gate.clamp + e.gate.block),
        data.scene ? el("td", {}, e.safety ? el("span", { class: "lvl " + e.safety.peak_level }, el("i"), e.safety.peak_level + " · " + fmt(e.safety.peak_risk)) : "–") : null,
        hasDeep ? el("td", { class: "num" }, e.deepdives && e.deepdives.length ? e.deepdives.length : "–") : null);
    }));
    [...seg.children].forEach((b) => b.classList.toggle("on", b.dataset.f === FILTER));
  }
  for (const [f, label] of filters) seg.append(el("button", { "data-f": f, onclick: () => { FILTER = f; fill(); } }, label));
  parts.push(el("div", { class: "row" }, seg, count));
  parts.push(el("div", { class: "card tablewrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Episode"), el("th", {}, "Outcome"), el("th", { class: "num" }, "Steps"), el("th", { class: "num" }, "Peak risk"),
      el("th", { class: "num" }, "First alert"), el("th", {}, "Leading symptom"), el("th", { class: "num" }, "Gate interventions"),
      data.scene ? el("th", {}, "Peak safety risk") : null, hasDeep ? el("th", { class: "num" }, "Deep dives") : null)), tbody)));
  app.replaceChildren(...parts);
  fill();
}

function barChart(bars, total) {
  const rowH = 30, left = 170, right = 70, W = 760, H = bars.length * rowH + 6;
  const max = Math.max(...bars.map((b) => b[1]));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, style: `max-width:${W}px`, role: "img", "aria-label": "Episodes by leading symptom" });
  bars.forEach(([label, n], i) => {
    const y = i * rowH + 6, w = Math.max(4, (W - left - right) * n / max);
    s.append(svg("text", { x: left - 10, y: y + 13, "text-anchor": "end", class: "lbl" }, label));
    const bar = svg("path", { d: `M${left},${y} h${w - 4} a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h${-(w - 4)} z`, fill: "var(--s1)" });
    const hit = svg("rect", { x: 0, y: y - 5, width: W, height: rowH, fill: "transparent" });
    hit.addEventListener("pointermove", (ev) => { bar.setAttribute("opacity", ".8"); showTip(ev, [[String(n), label], [pct(n / total), "of the episodes shown"]]); });
    hit.addEventListener("pointerleave", () => { bar.setAttribute("opacity", "1"); hideTip(); });
    s.append(bar, svg("text", { x: left + w + 8, y: y + 13, class: "lbl" }, String(n)), hit);
  });
  return s;
}

function situationMap(points, run) {
  const W = 760, H = 380, pad = 14;
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (v) => pad + (W - 2 * pad) * (v - x0) / (x1 - x0 || 1), Y = (v) => H - pad - (H - 2 * pad) * (v - y0) / (y1 - y0 || 1);
  const wrap = el("div");
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, style: `max-width:${W}px`, role: "img", "aria-label": "Map of decision moments by model embedding" });
  const pos = points.map((p) => [X(p.x), Y(p.y)]);
  // failed episodes drawn on top so they are not buried

      const c = frame(title, sub, opts.H || 78), top = 8, bot = c.H - 16;
      const vals = values.filter((v) => v !== null);
      const lo = opts.min ?? 0, hi = opts.max ?? (Math.max(0, ...vals) * 1.08 || 1);
      const y = (v) => bot - (bot - top) * (v - lo) / (hi - lo);
      for (const g of [lo, (lo + hi) / 2, hi]) {
        c.s.append(svg("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: "var(--grid)" }));
        c.s.append(svg("text", { x: L - 6, y: y(g) + 4, "text-anchor": "end" }, g >= 10 ? g.toFixed(0) : g.toFixed(hi < 0.1 ? 3 : 2).replace(/\.?0+$/, "") || "0"));
      }
      for (const t of [0, Math.round((n - 1) / 2), n - 1]) c.s.append(svg("text", { x: x(t), y: c.H - 2, "text-anchor": "middle" }, t));
      let d = "", pen = false, area = "";
      values.forEach((v, t) => { if (v === null) { pen = false; return; } d += (pen ? "L" : "M") + x(t).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
      if (opts.area && vals.length) {
        const first = values.findIndex((v) => v !== null), last = values.length - 1 - [...values].reverse().findIndex((v) => v !== null);
        area = d + `L${x(last)},${y(lo)}L${x(first)},${y(lo)}Z`;
        c.s.append(svg("path", { d: area, fill: "var(--wash)" }));
      }
      c.s.append(svg("path", { d, fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      if (opts.threshold !== undefined) {
        c.s.append(svg("line", { x1: L, x2: W - R, y1: y(opts.threshold), y2: y(opts.threshold), stroke: "var(--text-3)", "stroke-width": 1 }));
      }
      if (opts.alert !== undefined && opts.alert !== null) {
        const ax = x(opts.alert);
        c.s.append(svg("line", { x1: ax, x2: ax, y1: top - 4, y2: bot, stroke: "var(--critical)", "stroke-width": 2 }));
        c.s.append(svg("text", { x: ax + (ax > W - 120 ? -6 : 6), y: top + 4, "text-anchor": ax > W - 120 ? "end" : "start", class: "lbl" }, "▲ alert, step " + opts.alert));
      }
      const dot = svg("circle", { r: 4, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 });
      c.s.append(dot);
      finish(c, (t) => [[fmt(values[t], hi < 0.1 ? 4 : 2), title.toLowerCase()]]);
      updaters.push((t) => { const v = values[t]; dot.style.display = v === null ? "none" : ""; if (v !== null) { dot.setAttribute("cx", x(t)); dot.setAttribute("cy", y(v)); } });
    }

    if (alertCfg) line("Failure risk", "predicted from the step metrics below · grey line = alert threshold " + fmt(alertCfg.threshold), steps.risk, { H: 120, min: 0, max: 1, area: true, threshold: alertCfg.threshold, alert: meta.first_alert_step });

    // subtask band
    const names = [];
    steps.belief.forEach((b, t) => { const k = steps.plan_step[t]; if (k >= 0 && b.subtask !== undefined && names[k] === undefined) names[k] = b.subtask; });
    if (steps.plan_step.some((k) => k >= 0)) {
      const c = frame("Subtask", "what the policy believes it is doing", 34), half = (W - L - R) / Math.max(n - 1, 1) / 2;
      let start = 0;
      for (let t = 1; t <= n; t++) {
        if (t === n || steps.plan_step[t] !== steps.plan_step[start]) {
          const k = steps.plan_step[start], x0 = Math.max(L, x(start) - half) + 1, x1 = Math.min(W - R, x(t - 1) + half) - 1;
          if (k >= 0 && x1 > x0) {
            c.s.append(svg("rect", { x: x0, y: 4, width: x1 - x0, height: 16, rx: 3, fill: `var(${SERIES[k % SERIES.length]})` }));
            const label = names[k] || "step " + k;
            if (x1 - x0 > label.length * 6.6 + 14) c.s.append(svg("text", { x: (x0 + x1) / 2, y: 16, "text-anchor": "middle", class: "inseg" }, label));
          }
          start = t;
        }
      }
      finish(c, (t) => [[names[steps.plan_step[t]] || "–", "subtask"]]);
      const legend = el("div", { class: "legend" });
      names.forEach((nm, k) => { if (nm !== undefined) legend.append(el("span", {}, el("i", { style: `background:var(${SERIES[k % SERIES.length]})` }), nm)); });
      chartsCard.append(legend);
    }

    // gate row
    if (runInfo.run.gate) {
      const c = frame("Gate", "steps where the pre-actuation gate changed or stopped the action", 30);
      c.s.append(svg("line", { x1: L, x2: W - R, y1: 13, y2: 13, stroke: "var(--grid)" }));
      steps.verdict.forEach((v, t) => {
        if (v === "allow") return;
        if (v === "halt") { c.s.append(svg("rect", { x: x(t) - 5, y: 8, width: 10, height: 10, fill: "var(--critical)", stroke: "var(--surface)", "stroke-width": 2 })); c.s.append(svg("text", { x: x(t) - 10, y: 17, "text-anchor": "end", class: "lbl" }, "halt")); }
        else c.s.append(svg("circle", { cx: x(t), cy: 13, r: 4, fill: v === "block" ? "var(--serious)" : "var(--text-2)", stroke: "var(--surface)", "stroke-width": 2 }));
      });
      finish(c, (t) => [[steps.verdict[t], "gate verdict"], ...steps.violations[t].map((v) => [v.constraint, v.detail])]);
    }

    if (safety) {
      line("Safety risk", "chance of contact × severity × speed · 0.1 = medium, 0.4 = high", safety.risk, { min: 0, max: 1, area: true });
      line("Clearance to nearest hazard", "closest the current plan comes (px); below 0 is inside the hazard", safety.clearance.map((v) => Math.max(v, 0)), {});
    }
    if (deepSteps.length) {
      const c = frame("Deep dives", "decisions where the model was re-run and analysed", 30);
      c.s.append(svg("line", { x1: L, x2: W - R, y1: 13, y2: 13, stroke: "var(--grid)" }));
      for (const t of deepSteps) c.s.append(svg("circle", { cx: x(t), cy: 13, r: 4, fill: "var(--s7)", stroke: "var(--surface)", "stroke-width": 2 }));
      finish(c, (t) => [[deep[(decisionAt(t) || {}).t] ? "available" : "none", "deep dive for this decision"]]);
    }
    if (steps.reward && steps.reward.some((q) => q !== null)) line("Reward", "task progress reported by the environment", steps.reward, {});
    const extra = Object.keys(steps.metrics).filter((k) => !BUILTIN.has(k) && k !== "commit_step").map((k) => [k, EXTRA_TITLES[k] ? EXTRA_TITLES[k][0] : k.replaceAll("_", " "), EXTRA_TITLES[k] ? EXTRA_TITLES[k][1] : "custom signal"]);
    for (const [key, title, sub] of [...METRIC_CHARTS, ...extra]) {
      const v = steps.metrics[key];
      if (v && v.some((q) => q !== null)) line(title, sub, v, key === "direction_disagreement" || key === "reversal_rate" ? { min: 0, max: 1 }
        : key === "top_mode_share" ? { min: 0, max: 1 }
        : key === "plan_regressions" || key === "n_modes" ? { min: 0, max: Math.max(2, 2 * Math.ceil(Math.max(...v.filter((q) => q !== null)) / 2)) } : {});
    }
    setStep(cur);
  }

  function setStep(t) {
    cur = Math.max(0, Math.min(n - 1, t));
    drawFrame(cur);
    renderDecision(decisionAt(cur));
    renderDeep();
    stepno.textContent = `step ${cur} / ${n - 1}`;
    const b = steps.belief[cur] || {};
    dd["Subtask"].textContent = b.subtask ?? "–";
    const rest = Object.entries(b).filter(([k]) => k !== "subtask").map(([k, v]) => k.replaceAll("_", " ") + ": " + (Array.isArray(v) ? v.join(", ") : v));
    dd["Belief"].textContent = rest.join(" · ") || "–";
    dd["Risk"].textContent = steps.risk[cur] === null ? "–" : fmt(steps.risk[cur]) + (alertCfg ? (steps.risk[cur] >= alertCfg.threshold ? "  (above alert threshold)" : "") : "");
    dd["Proposed action"].textContent = steps.action[cur].map((v) => fmt(v, 3)).join(", ");
    dd["Executed action"].textContent = steps.executed[cur].map((v) => fmt(v, 3)).join(", ");
    const viol = steps.violations[cur].map((v) => v.constraint + " (" + v.detail + ")").join("; ");
    dd["Gate"].textContent = steps.verdict[cur] + (viol ? " · " + viol : "");
    if (safety) { const lv = safety.level[cur], ttc = safety.time_to_contact[cur];
      dd["Safety"].replaceChildren(el("span", { class: "lvl " + lv }, el("i"), `${lv} risk (${fmt(safety.risk[cur])})`),
        ` · nearest hazard: ${safety.hazard[cur]}, ${fmt(Math.max(safety.clearance[cur], 0), 0)} px clear` + (ttc !== null ? ` · plan reaches it in ${ttc} steps` : "") + (safety.inside[cur] ? " · INSIDE hazard zone" : "")); }
    for (const u of updaters) u(cur);
  }

  const nav = el("div", { class: "row", style: "margin:0 0 12px" },
    el("a", { class: "back", style: "margin:0", href: "#/run/" + run, onclick: (ev) => { ev.preventDefault(); nav("#/run/" + run); } }, "← All episodes in " + run),
    el("span", { style: "flex:1" }),
    el("button", { onclick: () => nav(`#/run/${run}/ep/${ids[at - 1]}`), ...(at <= 0 ? { disabled: "" } : {}) }, "Previous episode"),
    el("button", { onclick: () => nav(`#/run/${run}/ep/${ids[at + 1]}`), ...(at >= ids.length - 1 ? { disabled: "" } : {}) }, "Next episode"));
  app.replaceChildren(nav, el("h1", {}, epId), el("p", { class: "sub" }, meta.task || ""),
    el("div", { class: "ep-top" },
      el("div", { class: "card" }, cam, controls),
      el("div", { class: "card" }, el("h2", {}, "Episode"), summary, el("h2", {}, "At the selected step"), readout)),
    decidingCard, deepCard, chartsCard);
  build();
  let rz; window.onresize = () => { clearTimeout(rz); rz = setTimeout(build, 120); };
  document.onkeydown = (ev) => {
    if (ev.target.tagName === "SELECT") return;
    if (ev.key === "ArrowLeft") { setStep(cur - 1); ev.preventDefault(); }
    if (ev.key === "ArrowRight") { setStep(cur + 1); ev.preventDefault(); }
  };
}
boot();
</script>
</body>
</html>
