[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepscope"
version = "0.1.0"
description = "Step-level decision tracing, failure prediction and pre-actuation gating for robot policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "gymnasium>=1.0"]
gym = ["gymnasium>=1.0"]

[project.scripts]
stepscope = "stepscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stepscope = ["viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
